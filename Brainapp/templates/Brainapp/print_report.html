{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Report - MRI System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    @media print {
      .no-print {
        display: none !important;
      }
      .report-scroll {
        overflow: visible !important;
        max-height: none !important;
        height: auto !important;
      }
      .report-card {
        page-break-inside: avoid;
        break-inside: avoid;
      }
      body {
        font-size: 12pt;
        line-height: 1.4;
      }
      .content-card {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
      }
    }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <i class="fas fa-brain"></i>
                <h1>MRI System</h1>
            </div>
        </header>
        <main class="dashboard-main">
            <div class="content-card">
                <div class="page-header">
                    <h2>Report</h2>
                    <div class="button-group no-print">
                        <button class="btn-primary" onclick="window.print()">
                            <i class="fas fa-print"></i> Print to PDF
                        </button>
                    </div>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">Patient:</span>
                        <span class="value">{{ result.patient.user.name }}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Doctor:</span>
                        <span class="value">{{ result.doctor.user.name }}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Date:</span>
                        <span class="value">{{ result.date }}</span>
                    </div>
                </div>
                <div class="image-preview" style="margin-top:2rem;">
                    <h3>MRI Image</h3>
                    <img src="{{ mri.image.url }}" alt="MRI Image" style="max-width: 400px; border-radius: 8px; box-shadow: var(--card-shadow);"/>
                </div>
                <div class="report-card" style="margin-top:2rem;">
                    <h3>Report</h3>
                    <div class="report-scroll">{{ result.report|linebreaksbr }}</div>
                </div>
                <a href="{% url 'patient_data' %}" class="back-btn no-print" style="margin-top:2rem; display:inline-block;">
                    <i class="fas fa-arrow-left"></i> Back to Patient Data
                </a>
            </div>
        </main>
    </div>
    <script src="{% static 'js/doctor.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
