{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result - MRI System</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
    @media print {
      .no-print {
        display: none !important;
      }
    }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="header-left">
                <i class="fas fa-brain"></i>
                <h1>MRI System</h1>
            </div>
            <div class="header-right">
                <div class="settings-dropdown">
                    <button class="settings-btn">
                        <i class="fas fa-gear"></i>
                    </button>
                    <div class="dropdown-content">
                        <div class="theme-toggle">
                            <label for="darkMode">Dark Mode</label>
                            <input type="checkbox" id="darkMode">
                        </div>
                        <button id="logoutBtn" class="logout-btn">
                            <i class="fas fa-sign-out-alt"></i>
                            Logout
                        </button>
                    </div>
                </div>
            </div>
        </header>
        <main class="dashboard-main">
            <div class="content-card">
                <div class="page-header">
                    <h2>Analysis Result</h2>
                    <button class="btn-primary no-print" onclick="window.print()">
                        <i class="fas fa-print"></i> Print to PDF
                    </button>
                </div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="label">Patient:</span>
                        <span class="value">{{ result.patient.user.name }}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Doctor:</span>
                        <span class="value">{{ result.doctor.user.name }}</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Date:</span>
                        <span class="value">{{ result.date }}</span>
                    </div>
                </div>
                <div class="image-preview" style="margin-top:2rem;">
                    <h3>MRI Image</h3>
                    <img src="{{ mri.image.url }}" alt="MRI Image" style="max-width: 400px; border-radius: 8px; box-shadow: var(--card-shadow);"/>
                </div>
                <div class="report-card" style="margin-top:2rem;">
                    <h3>Generated Report</h3>
                    <div class="report-scroll">{{ result.report|linebreaksbr }}</div>
                </div>
                <a href="{% url 'mri_analysis' %}" class="back-btn no-print" style="margin-top:2rem; display:inline-block;">
                    <i class="fas fa-arrow-left"></i> Back to Analysis
                </a>
            </div>
        </main>
    </div>
    <script src="{% static 'js/doctor.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
